<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Outer Globe Circle -->
  <circle cx="250" cy="250" r="170" stroke="#2B3A42" stroke-width="14" fill="#FAF9F6"/>
  <circle cx="250" cy="250" r="160" stroke="#3F8A8C" stroke-width="4" fill="#E8F4F5"/>
  
  <!-- Equator & Latitudes -->
  <line x1="80" y1="250" x2="420" y2="250" stroke="#2B3A42" stroke-width="10"/>
  <ellipse cx="250" cy="170" rx="140" ry="40" stroke="#2B3A42" stroke-width="8" stroke-dasharray="12 8"/>
  <ellipse cx="250" cy="330" rx="140" ry="40" stroke="#2B3A42" stroke-width="8" stroke-dasharray="12 8"/>

  <!-- Central Longitude Meridian -->
  <ellipse cx="250" cy="250" rx="80" ry="170" stroke="#2B3A42" stroke-width="10"/>
  <line x1="250" y1="80" x2="250" y2="420" stroke="#3F8A8C" stroke-width="6"/>

  <!-- Satellite / Orbit Ring -->
  <ellipse cx="250" cy="250" rx="210" ry="70" stroke="#E05A47" stroke-width="8" stroke-linecap="round" transform="rotate(-25 250 250)"/>
  <circle cx="430" cy="165" r="14" fill="#FAF9F6" stroke="#E05A47" stroke-width="6"/>
</svg>
