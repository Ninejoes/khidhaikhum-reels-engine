<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Chart Axes -->
  <line x1="60" y1="420" x2="440" y2="420" stroke="#2B3A42" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="440" x2="80" y2="70" stroke="#2B3A42" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Grid Lines -->
  <line x1="80" y1="330" x2="430" y2="330" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="80" y1="230" x2="430" y2="230" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="80" y1="130" x2="430" y2="130" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Bar 1 -->
  <rect x="110" y="270" width="45" height="145" rx="6" stroke="#2B3A42" stroke-width="8" fill="#E8F4F5"/>
  <!-- Bar 2 -->
  <rect x="180" y="200" width="45" height="215" rx="6" stroke="#2B3A42" stroke-width="8" fill="#E8F4F5"/>
  <!-- Bar 3 -->
  <rect x="250" y="250" width="45" height="165" rx="6" stroke="#2B3A42" stroke-width="8" fill="#E8F4F5"/>
  <!-- Bar 4 -->
  <rect x="320" y="140" width="45" height="275" rx="6" stroke="#2B3A42" stroke-width="8" fill="#3F8A8C"/>

  <!-- Trend Line Upward -->
  <polyline points="130,250 200,180 270,220 345,110 420,80" stroke="#E05A47" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polyline points="390,75 425,75 425,110" stroke="#E05A47" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Points -->
  <circle cx="130" cy="250" r="10" fill="#FAF9F6" stroke="#E05A47" stroke-width="6"/>
  <circle cx="200" cy="180" r="10" fill="#FAF9F6" stroke="#E05A47" stroke-width="6"/>
  <circle cx="270" cy="220" r="10" fill="#FAF9F6" stroke="#E05A47" stroke-width="6"/>
  <circle cx="345" cy="110" r="10" fill="#FAF9F6" stroke="#E05A47" stroke-width="6"/>
</svg>
